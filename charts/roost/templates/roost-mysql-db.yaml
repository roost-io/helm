{{- if and (.Values.database.integrated) (eq .Values.database.type "mysql") }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: roost-mysql-db-config
  namespace: {{ .Release.Namespace }}
data:
  # MYSQL_ROOT_PASSWORD: 'Roost#123' # '{{ .Values.database.password }}'
  # MYSQL_DATABASE: 'roostio' # '{{ .Values.database.schema }}'
  # MYSQL_USER: 'roost' # '{{ .Values.database.user }}'
  # MYSQL_PASSWORD: 'Roost#123' # '{{ .Values.database.password }}'
  MYSQL_ROOT_PASSWORD: "{{ .Values.database.rootPassword }}"
  MYSQL_DATABASE: "{{ .Values.database.schema }}"
  # MYSQL_USER: "{{ .Values.database.user }}"
  MYSQL_PASSWORD: "{{ .Values.database.password }}"

---
apiVersion: v1
kind: Service
metadata:
  name: roost-mysql-db-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: roost-mysql-db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: roost-mysql-db
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  serviceName: roost-mysql-db-svc
  selector:
    matchLabels:
      app: roost-mysql-db
  template:
    metadata:
      labels:
        app: roost-mysql-db
    spec:
      securityContext:
        fsGroup: 999        # Ensures the mounted volume is readable/writable by MySQL
        runAsUser: 999      # Matches the MySQL container user
        runAsGroup: 999
      containers:
        - name: roost-mysql-db
          image: zbio/roostai_mysql_db:{{ .Values.roostConfig.dbVersion }}
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          envFrom:
            - configMapRef:
                name: roost-mysql-db-config
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: roost-mysql-db-data
          ports:
            - containerPort: 3306
          args:
            - --bind-address=*
            - --default-authentication-plugin=mysql_native_password
          imagePullPolicy: Always
  volumeClaimTemplates:
    - metadata:
        name: roost-mysql-db-data
        annotations:
          "helm.sh/resource-policy": keep
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.database.storage.size }}
        storageClassName: {{ .Values.database.storage.storageClass }}

---
{{- end }}
